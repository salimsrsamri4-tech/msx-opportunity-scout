<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>رصد فرص بورصة مسقط</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>رصد فرص بورصة مسقط</h1>
      <span class="meta-line" id="meta-line">جارٍ التحميل...</span>
    </header>

    <div class="search-results">
      <input class="search-box" id="search-input" type="text" placeholder="ابحث برمز الشركة أو اسمها (مثال: OQEP أو أوكيو)" />
      <div class="search-dropdown" id="search-dropdown" style="display:none"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>آخر الفرص المرصودة</h2>
        <div class="filters">
          <button class="active" data-filter="all">الكل</button>
          <button data-filter="technical">فنية (سعر/حجم)</button>
          <button data-filter="financial">نتائج مالية</button>
        </div>
        <div id="opp-list"></div>
      </div>

      <div class="card">
        <h2>تفاصيل الشركة</h2>
        <div id="company-panel"></div>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
