name: رصد فرص بورصة مسقط اليومي

on:
  schedule:
    # الساعة 10:00 بتوقيت UTC = 14:00 بتوقيت مسقط، من الأحد إلى الخميس (أيام تداول MSX)
    - cron: "0 10 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: node src/main.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: حفظ سجل البيانات التاريخي
        run: |
          git config user.name "msx-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "تحديث سجل بيانات الأسعار"
          git push
